<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجربات كاظم الغيظ</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1b4332">
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Amiri', serif; background-color: #fcfcf0; margin: 0; padding: 15px; text-align: center; }
        .sticky-top-container { position: sticky; top: 0; background-color: #fcfcf0; z-index: 999; padding: 5px 0; box-shadow: 0 4px 6px -4px rgba(0,0,0,0.1); }
        .header-box { background-color: #000000; color: #d4af37; padding: 20px; border-radius: 12px; margin-bottom: 10px; font-weight: bold; cursor: pointer; font-size: 26px; border: 2px solid #1b4332; }
        .admin-form { display: none; background: #eee; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 2px dashed #1b4332; text-align: right; max-height: 80vh; overflow-y: auto; }
        .admin-section-box { background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ccc; }
        .admin-section-title { font-size: 18px; font-weight: bold; color: #1b4332; margin: 0 0 10px 0; border-bottom: 2px solid #1b4332; padding-bottom: 5px; }
        .admin-khatma-row { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 8px; margin: 5px 0; border-radius: 6px; border: 1px solid #ddd; font-size: 15px; font-weight: bold; }
        .action-btn { background: #000; color: #d4af37; border: 1px solid #1b4332; padding: 5px 10px; border-radius: 5px; font-size: 14px; cursor: pointer; font-family: 'Amiri', serif; }
        .mic-btn { background: #1b4332; color: #d4af37; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 18px; margin-right: 5px; }
        .search-container { display: flex; align-items: center; margin-bottom: 10px; }
        .search-box { flex: 1; padding: 12px; border-radius: 8px; border: 2px solid #1b4332; font-size: 18px; box-sizing: border-box; text-align: right; background: #fff; }
        .search-mic-btn { background: #1b4332; color: #d4af37; border: 2px solid #1b4332; padding: 11px 15px; border-radius: 8px; cursor: pointer; font-size: 20px; margin-right: 8px; }
        .tabs-container { display: flex; gap: 6px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px 4px; border: 2px solid #333; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 18px; font-family: 'Amiri', serif; color: #fff; }
        #allTab { background-color: #1b4332; }
        #imagesTab { background-color: #8B4513; }
        #favTab { background-color: #4A0E4E; }
        .tab-btn.active { border: 3px solid #d4af37; transform: scale(1.03); }
        .khatma-item { background: #1b4332; color: #fff; padding: 15px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: bold; }
        .khatma-title { flex: 1; cursor: pointer; text-align: right; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
        .modal-card { background: #fffdf0; width: 100%; max-width: 500px; border-radius: 15px; border: 3px solid #1b4332; text-align: right; margin: auto; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-header { background: #1b4332; color: #d4af37; padding: 15px; font-size: 22px; border-bottom: 2px solid #d4af37; text-align: center; }
        .modal-body { padding: 20px; font-size: 20px; overflow-y: auto; text-align: right; line-height: 1.8; color: #000; flex: 1; }
        .close-btn { background-color: #1b4332; color: #d4af37; padding: 10px 30px; border-radius: 8px; border: 1px solid #d4af37; cursor: pointer; font-size: 18px; font-weight: bold; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-database.js"></script>
</head>
<body>

    <audio id="bgAudio" loop preload="auto" style="display: none;"></audio>

    <div class="sticky-top-container">
        <div class="header-box" id="adminTrigger">مجربات كاظم الغيظ</div>
        
        <div class="admin-form" id="adminForm">
            <div class="admin-section-box">
                <button type="button" class="action-btn" style="width:100%; background:red;" onclick="document.getElementById('bgAudio').pause()">إيقاف الصوت 🔇</button>
            </div>

            <h3 style="margin-top:0; text-align: center;">لوحة الإدارة</h3>
            
            <div class="admin-section-box">
                <div class="admin-section-title">إعدادات الذكاء الاصطناعي (Gemini)</div>
                <input type="password" id="geminiApiKeyInput" placeholder="أدخل مفتاح Gemini API هنا..." style="width:100%; padding:8px; margin-bottom:5px; box-sizing: border-box;">
                <button type="button" class="action-btn" style="width:100%; background:#1b4332; color:#d4af37;" onclick="saveGeminiKey()">حفظ مفتاح الـ API</button>
            </div>

            <div class="admin-section-box">
                <div class="admin-section-title">إدارة الصوت الخلفي</div>
                <input type="text" id="audioUrlInput" placeholder="رابط ملف الصوت (mp3)..." style="width:100%; padding:8px; margin-bottom:5px; box-sizing: border-box;">
                <input type="file" id="audioFile" accept="audio/*" style="width:100%; margin-bottom: 8px; box-sizing: border-box;">
                <button type="button" class="action-btn" style="width:100%; background:#8B4513; color:white;" onclick="saveAudioSettings()">حفظ وتطبيق الصوت</button>
            </div>

            <div class="admin-section-box">
                <div class="admin-section-title">إدارة الختمات النصية</div>
                <div id="adminTextListContainer" style="max-height: 150px; overflow-y: auto; margin-bottom: 10px;"></div>
                <input type="hidden" id="editKeyId">
                <input type="text" id="singleTitle" placeholder="عنوان الختمة..." style="width:100%; padding:8px; margin-bottom:5px; box-sizing: border-box;">
                <textarea id="singleContent" placeholder="محتوى الختمة..." style="width:100%; height:80px; box-sizing: border-box; margin-bottom:5px;"></textarea>
                <input type="file" id="singleImageFile" accept="image/*" style="width:100%; margin-bottom: 8px; box-sizing: border-box;">
                <button id="saveSingleBtn" style="width:100%; padding:8px; background:#1b4332; color:white; border:none; font-weight:bold; cursor:pointer;">حفظ / تعديل الختمة</button>
            </div>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="ابحث باسم الختمة أو بكلمة منها..." onkeyup="filterKhatmas()">
        </div>
        
        <div class="tabs-container">
            <button class="tab-btn active" id="allTab" onclick="switchTab('all')">الختمات</button>
            <button class="tab-btn" id="imagesTab" onclick="switchTab('images')">ختمات مصورة</button>
            <button class="tab-btn" id="favTab" onclick="switchTab('fav')">المفضلة</button>
        </div>
    </div>

    <!-- هنا سيتم عرض الختمات فوراً بدون شاشة تحميل -->
    <div id="listContainer">
        <p style="color:#666; margin-top:20px;">جاري تحميل البيانات...</p>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header" id="displayTitle"></div>
            <div class="modal-body" id="displayContent"></div>
            <div style="padding:15px; text-align:center;"><button class="close-btn" onclick="document.getElementById('modalOverlay').style.display='none'">إغلاق</button></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://khatmas-app-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let allKhatmas = {};
        let favorites = JSON.parse(localStorage.getItem('user_favorites')) || [];

        // تحميل فوري من الذاكرة المحلية إن وجدت لتجنب الانتظار
        const cached = localStorage.getItem('offline_khatmas_perfect');
        if (cached) {
            try {
                allKhatmas = JSON.parse(cached);
                filterKhatmas();
                renderAdminLists(allKhatmas);
            } catch(e){}
        }

        // جلب البيانات من فايربيس بصمت
        db.ref('khatmas').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                allKhatmas = data;
                localStorage.setItem('offline_khatmas_perfect', JSON.stringify(data));
                filterKhatmas();
                renderAdminLists(allKhatmas);
            } else {
                document.getElementById('listContainer').innerHTML = '<p style="color:#666;">لا توجد ختمات مضافة حتى الآن.</p>';
            }
        });

        window.renderList = (data, view = 'all') => {
            const container = document.getElementById('listContainer');
            if (!container) return;
            container.innerHTML = '';
            
            if (!data || Object.keys(data).length === 0) {
                container.innerHTML = '<p style="color:#666;">لا توجد نتائج مطابقة.</p>';
                return;
            }

            let htmlContent = '';
            Object.keys(data).forEach(key => {
                const item = data[key];
                const hasImage = item.image && typeof item.image === 'string' && item.image.trim() !== "";

                if (view === 'fav' && !favorites.includes(key)) return;
                if (view === 'all' && hasImage) return;
                if (view === 'images' && !hasImage) return;

                let displayTitle = item.title || "بدون عنوان";
                const isFav = favorites.includes(key) ? '❤️' : '🤍';
                
                htmlContent += `
                    <div class="khatma-item">
                        <div class="khatma-title" onclick="show('${key}')">${displayTitle}</div>
                        <button onclick="toggleFav('${key}')" style="background:none; border:none; font-size:20px; cursor:pointer;">${isFav}</button>
                    </div>`;
            });
            
            container.innerHTML = htmlContent || '<p style="color:#666;">لا توجد عناصر في هذا القسم.</p>';
        };

        window.renderAdminLists = (data) => {
            const textContainer = document.getElementById('adminTextListContainer');
            if (!textContainer) return;
            textContainer.innerHTML = '';
            
            if (!data || Object.keys(data).length === 0) {
                textContainer.innerHTML = '<p style="color:#666; text-align:center;">لا توجد ختمات.</p>';
                return;
            }

            let html = '';
            Object.keys(data).forEach(key => {
                const item = data[key];
                html += `
                    <div class="admin-khatma-row">
                        <span>${item.title || 'بدون عنوان'}</span>
                        <div>
                            <button onclick="edit('${key}')" style="cursor:pointer; padding:2px 6px; margin-left:5px;">✏️</button>
                            <button onclick="del('${key}')" style="color:red; cursor:pointer; padding:2px 6px;">🗑️</button>
                        </div>
                    </div>`;
            });
            textContainer.innerHTML = html;
        };

        window.show = (key) => {
            if (allKhatmas[key]) {
                document.getElementById('displayTitle').innerText = allKhatmas[key].title || "بدون عنوان";
                const displayContent = document.getElementById('displayContent');
                let htmlOutput = '';
                if (allKhatmas[key].image) {
                    htmlOutput += `<div style="text-align: center; margin-bottom: 15px;"><img src="${allKhatmas[key].image}" style="max-width: 100%; border-radius: 8px;"></div>`;
                }
                if (allKhatmas[key].content) {
                    htmlOutput += `<div>${allKhatmas[key].content.replace(/\n/g, '<br>')}</div>`;
                }
                displayContent.innerHTML = htmlOutput || 'لا يوجد محتوى.';
                document.getElementById('modalOverlay').style.display = 'flex';
            }
        };

        window.toggleFav = (key) => {
            const idx = favorites.indexOf(key);
            idx > -1 ? favorites.splice(idx, 1) : favorites.push(key);
            localStorage.setItem('user_favorites', JSON.stringify(favorites));
            filterKhatmas();
        };

        window.del = async (key) => { 
            if(confirm("هل أنت متأكد من الحذف؟")) {
                delete allKhatmas[key];
                localStorage.setItem('offline_khatmas_perfect', JSON.stringify(allKhatmas));
                filterKhatmas();
                renderAdminLists(allKhatmas);
                await db.ref('khatmas/' + key).remove(); 
            }
        };

        window.edit = (key) => {
            document.getElementById('editKeyId').value = key;
            document.getElementById('singleTitle').value = allKhatmas[key].title || '';
            document.getElementById('singleContent').value = allKhatmas[key].content || '';
        };

        document.getElementById('saveSingleBtn').onclick = async () => {
            const key = document.getElementById('editKeyId').value;
            const title = document.getElementById('singleTitle').value.trim();
            const content = document.getElementById('singleContent').value.trim();
            const imageInput = document.getElementById('singleImageFile');

            if (!title) return alert("الرجاء إدخال عنوان الختمة!");
            let existingImage = (key && allKhatmas[key] && allKhatmas[key].image) ? allKhatmas[key].image : "";

            const saveProcess = (imgData) => {
                const data = { title: title, content: content, image: imgData };
                if (key) {
                    db.ref('khatmas/' + key).set(data);
                } else {
                    db.ref('khatmas').push(data);
                }
                document.getElementById('singleTitle').value = '';
                document.getElementById('singleContent').value = '';
                document.getElementById('editKeyId').value = '';
                document.getElementById('singleImageFile').value = '';
            };

            if (imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    saveProcess(e.target.result);
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                saveProcess(existingImage);
            }
        };

        document.getElementById('adminTrigger').onclick = () => {
            if(prompt("كلمة السر:") === "123456") {
                const form = document.getElementById('adminForm');
                form.style.display = (form.style.display === 'block') ? 'none' : 'block';
            }
        };

        window.switchTab = (tab) => {
            document.getElementById('allTab').classList.toggle('active', tab === 'all');
            document.getElementById('imagesTab').classList.toggle('active', tab === 'images');
            document.getElementById('favTab').classList.toggle('active', tab === 'fav');
            filterKhatmas();
        };

        window.filterKhatmas = () => {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const activeTab = document.querySelector('.tab-btn.active').id;
            let currentView = 'all';
            if (activeTab === 'imagesTab') currentView = 'images';
            if (activeTab === 'favTab') currentView = 'fav';

            const filtered = {};
            Object.keys(allKhatmas).forEach(k => {
                const title = (allKhatmas[k].title || "").toLowerCase();
                if (!query || title.includes(query)) {
                    filtered[k] = allKhatmas[k];
                }
            });
            renderList(filtered, currentView);
        };
    </script>
</body>
</html>
