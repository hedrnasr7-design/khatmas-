<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مجربات كاظم الغيظ</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1b4332">
    
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Amiri', serif; background-color: #fcfcf0; margin: 0; padding: 15px; text-align: center; -webkit-user-select: none; user-select: none; }
        
        input, textarea, .action-btn { 
            -webkit-user-select: text !important; 
            user-select: text !important; 
            pointer-events: auto !important; 
        }

        .sticky-top-container {
            position: sticky;
            top: 0;
            background-color: #fcfcf0;
            z-index: 999;
            padding-top: 5px;
            padding-bottom: 5px;
            box-shadow: 0 4px 6px -4px rgba(0,0,0,0.1);
        }

        .header-box { background-color: #000000; color: #d4af37; padding: 20px; border-radius: 12px; margin-bottom: 10px; font-weight: bold; cursor: pointer; font-size: 26px; border: 2px solid #1b4332; }
        .admin-form { display: none; background: #eee; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 2px dashed #1b4332; text-align: right; }
        
        .admin-section-box { background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ccc; }
        .admin-section-title { font-size: 18px; font-weight: bold; color: #1b4332; margin-top: 0; margin-bottom: 10px; border-bottom: 2px solid #1b4332; padding-bottom: 5px; }

        .admin-khatma-row { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 8px; margin: 5px 0; border-radius: 6px; border: 1px solid #ddd; font-size: 15px; font-weight: bold; }
        
        .text-controls { display: flex; gap: 5px; margin-bottom: 5px; }
        .action-btn { background: #000; color: #d4af37; border: 1px solid #1b4332; padding: 5px 10px; border-radius: 5px; font-size: 14px; cursor: pointer; font-family: 'Amiri', serif; }

        .search-box { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 2px solid #1b4332; font-size: 18px; box-sizing: border-box; text-align: right; background: #fff; }
        .tabs-container { display: flex; gap: 10px; margin-bottom: 15px; }
        
        .tab-btn { 
            flex: 1; 
            padding: 10px; 
            border: 2px solid #333; 
            border-radius: 8px; 
            font-weight: 900; 
            cursor: pointer; 
            font-size: 19px; 
            font-family: 'Amiri', serif; 
            color: #fff;
            transition: all 0.2s ease;
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
        }
        
        #allTab { background-color: #1b4332; }
        #imagesTab { background-color: #8B4513; }
        #favTab { background-color: #4A0E4E; }

        .tab-btn.active { 
            border: 3px solid #d4af37;
            transform: scale(1.03);
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        .khatma-item { background: #1b4332; color: #fff; padding: 15px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: bold; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        .khatma-title { flex: 1; cursor: pointer; text-align: right; }
        
        .loading-box { background: #fffdf0; border: 2px solid #1b4332; padding: 20px; border-radius: 12px; margin: 20px auto; max-width: 300px; font-size: 20px; font-weight: bold; color: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .progress-bar-container { background: #e2e8f0; border-radius: 10px; height: 15px; width: 100%; margin-top: 10px; overflow: hidden; border: 1px solid #1b4332; }
        .progress-bar-fill { background: #1b4332; height: 100%; width: 0%; transition: width 0.2s ease; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; box-sizing: border-box; padding: 15px; }
        .modal-card { background: #fffdf0; width: 100%; max-width: 500px; border-radius: 15px; border: 3px solid #1b4332; text-align: right; margin: auto; box-sizing: border-box; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-header { background: #1b4332; color: #d4af37; padding: 15px; font-size: 22px; border-bottom: 2px solid #d4af37; text-align: center; }
        .modal-body { padding: 20px; font-size: 20px; overflow-y: auto; text-align: right; line-height: 1.8; color: #000; flex: 1; }
        .close-btn { background-color: #1b4332; color: #d4af37; padding: 10px 30px; border-radius: 8px; border: 1px solid #d4af37; cursor: pointer; font-size: 18px; font-weight: bold; }
    </style>
    
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/7.24.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body oncopy="return false" oncontextmenu="return false">

    <div class="sticky-top-container">
        <div class="header-box" id="adminTrigger">مجربات كاظم الغيظ</div>
        
        <div class="admin-form" id="adminForm">
            <h3 style="margin-top:0; text-align: center;">لوحة الإدارة</h3>
            
            <!-- حقل الختمات النصية -->
            <div class="admin-section-box">
                <div class="admin-section-title">إدارة الختمات (النصية)</div>
                <div id="adminTextListContainer" style="max-height: 150px; overflow-y: auto; margin-bottom: 10px;"></div>
                
                <input type="hidden" id="editKeyId">
                <input type="text" id="singleTitle" placeholder="عنوان الختمة..." style="width:100%; padding:8px; margin-bottom:5px; box-sizing: border-box;">
                
                <div class="text-controls">
                    <button type="button" class="action-btn" onclick="selectAllText()">تحديد الكل</button>
                    <button type="button" class="action-btn" onclick="copyText()">نسخ</button>
                    <button type="button" class="action-btn" onclick="cutText()">قص</button>
                </div>

                <textarea id="singleContent" placeholder="محتوى الختمة..." style="width:100%; height:100px; box-sizing: border-box; margin-bottom: 8px;"></textarea>
                
                <label style="display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px;">تغيير/إضافة صورة (اختياري):</label>
                <input type="file" id="singleImageFile" accept="image/*" style="width:100%; margin-bottom: 8px; box-sizing: border-box;">
                
                <div id="imagePreviewContainer" style="margin: 5px 0 10px 0;">
                    <img id="currentImagePreview" src="" style="max-width: 80px; display: none; border: 1px solid #ccc; padding: 2px; border-radius: 4px;" alt="معاينة الصورة">
                </div>

                <button id="saveSingleBtn" style="width:100%; padding:8px; background:#1b4332; color:white; border:none; font-weight:bold; cursor:pointer;">حفظ / تعديل الختمة النصية</button>
                
                <hr style="margin: 12px 0;">
                <textarea id="bulkArea" placeholder="إضافة جماعية (افصل بينها بـ ~~~)..." style="width:100%; height:60px; box-sizing: border-box; margin-bottom: 5px;"></textarea>
                <button id="saveBtn" style="width:100%; padding:8px; background:#1b4332; color:white; border:none; font-weight:bold; cursor:pointer;">حفظ جماعي للنصوص</button>
            </div>

            <!-- حقل الختمات المصورة -->
            <div class="admin-section-box">
                <div class="admin-section-title">إدارة الختمات المصورة (الذكية)</div>
                <div id="adminImageListContainer" style="max-height: 150px; overflow-y: auto; margin-bottom: 10px;"></div>

                <h4 style="margin:5px 0; font-size: 15px;">رفع صور متعددة واستخراج العناوين تلقائياً</h4>
                <input type="file" id="multiImagesInput" accept="image/*" multiple style="width:100%; margin-bottom: 8px; box-sizing: border-box;">
                <button id="saveMultiImagesBtn" style="width:100%; padding:8px; background:#8B4513; color:white; border:none; font-weight:bold; cursor:pointer;">رفع ومعالجة الصور الذكية</button>
                <div id="ocrProgress" style="font-size: 13px; margin-top: 5px; font-weight: bold; color: #1b4332;"></div>
            </div>

        </div>

        <input type="text" id="searchInput" class="search-box" placeholder="ابحث باسم الختمة أو بكلمة منها..." onkeyup="filterKhatmas()">
        
        <div class="tabs-container">
            <button class="tab-btn active" id="allTab" onclick="switchTab('all')">الختمات</button>
            <button class="tab-btn" id="imagesTab" onclick="switchTab('images')">ختمات مصورة</button>
            <button class="tab-btn" id="favTab" onclick="switchTab('fav')">المفضلة</button>
        </div>
    </div>

    <div id="listContainer">
        <div class="loading-box" id="loadingBoxContainer">
            <div>جاري تحميل الختمات... <span id="progressPercent">0</span>%</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header" id="displayTitle"></div>
            <div class="modal-body" id="displayContent"></div>
            <div style="padding:15px; text-align:center;"><button class="close-btn" onclick="document.getElementById('modalOverlay').style.display='none'">إغلاق</button></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://khatmas-app-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allKhatmas = JSON.parse(localStorage.getItem('offline_khatmas_perfect')) || {};
        let favorites = JSON.parse(localStorage.getItem('user_favorites')) || [];

        function updateProgressUI(percent) {
            const percentEl = document.getElementById('progressPercent');
            const fillEl = document.getElementById('progressBarFill');
            if (percentEl && fillEl) {
                percentEl.innerText = percent;
                fillEl.style.width = percent + '%';
            }
        }

        if (Object.keys(allKhatmas).length > 0) {
            updateProgressUI(100);
            setTimeout(() => {
                filterKhatmas();
                renderAdminLists(allKhatmas);
            }, 10);
        } else {
            let p = 0;
            var loaderTimer = setInterval(() => {
                if (p < 90 && Object.keys(allKhatmas).length === 0) {
                    p += 30;
                    updateProgressUI(p);
                }
            }, 30);
        }

        document.getElementById('adminTrigger').onclick = () => {
            if(prompt("كلمة السر:") === "123456") {
                const form = document.getElementById('adminForm');
                const isHidden = (form.style.display === 'none' || form.style.display === '');
                form.style.display = isHidden ? 'block' : 'none';
                if(isHidden) {
                    renderAdminLists(allKhatmas);
                }
            }
        };

        function selectAllText() {
            const textarea = document.getElementById('singleContent');
            textarea.select();
            textarea.setSelectionRange(0, 99999);
        }

        function copyText() {
            const textarea = document.getElementById('singleContent');
            textarea.select();
            navigator.clipboard.writeText(textarea.value).then(() => {
                alert("تم نسخ النص بنجاح!");
            });
        }

        function cutText() {
            const textarea = document.getElementById('singleContent');
            textarea.select();
            navigator.clipboard.writeText(textarea.value).then(() => {
                textarea.value = '';
                alert("تم قص النص!");
            });
        }

        db.ref('khatmas').on('value', (snapshot) => {
            if (loaderTimer) clearInterval(loaderTimer);
            updateProgressUI(100);
            
            const data = snapshot.val();
            if (data) {
                allKhatmas = data;
                localStorage.setItem('offline_khatmas_perfect', JSON.stringify(data));
            } else {
                allKhatmas = {};
                localStorage.removeItem('offline_khatmas_perfect');
            }
            
            filterKhatmas();
            renderAdminLists(allKhatmas);

        }, (error) => {
            if (loaderTimer) clearInterval(loaderTimer);
            updateProgressUI(100);
            filterKhatmas();
            renderAdminLists(allKhatmas);
        });

        function toArabicDigits(num) {
            const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
            return num.toString().replace(/\d/g, (digit) => arabicNumbers[digit]);
        }

        function extractNumber(title) {
            if (!title) return 0;
            const match = title.match(/[\d٠-٩]+/);
            if (!match) return 0;
            let val = match[0].replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
            return parseInt(val, 10) || 0;
        }

        window.renderList = (data, view = 'all') => {
            const container = document.getElementById('listContainer');
            if (!container) return;
            container.innerHTML = '';
            
            if (!data || Object.keys(data).length === 0) {
                container.innerHTML = '<p style="color:#666;">لا توجد نتائج مطابقة.</p>';
                return;
            }

            const sortedKeys = Object.keys(data).sort((a, b) => extractNumber(data[a].title) - extractNumber(data[b].title));
            let htmlContent = '';
            let imageCounter = 1;

            sortedKeys.forEach(key => {
                const hasImage = data[key].image && data[key].image.trim() !== "";
                
                if (view === 'fav' && !favorites.includes(key)) return;
                if (view === 'all' && hasImage) return;
                if (view === 'images' && !hasImage) return;

                let displayTitle = data[key].title;

                if (view === 'images') {
                    let arabicSeq = toArabicDigits(imageCounter);
                    let cleanTitle = data[key].title.replace(/^ختمة\s*\([٠-٩\d]+\)\s*-\s*/, '').replace(/^[٠-٩\d]+\s*-\s*/, '');
                    displayTitle = `${arabicSeq} - ${cleanTitle}`;
                    imageCounter++;
                }

                const isFav = favorites.includes(key) ? '❤️' : '🤍';
                htmlContent += `
                    <div class="khatma-item">
                        <div class="khatma-title" onclick="show('${key}')">${displayTitle}</div>
                        <button onclick="toggleFav('${key}')" style="background:none; border:none; font-size:20px; cursor:pointer;">${isFav}</button>
                    </div>`;
            });
            
            container.innerHTML = htmlContent || '<p style="color:#666;">لا توجد عناصر في هذا القسم.</p>';
        };

        window.renderAdminLists = (data) => {
            const textContainer = document.getElementById('adminTextListContainer');
            const imageContainer = document.getElementById('adminImageListContainer');
            if (!textContainer || !imageContainer) return;
            
            textContainer.innerHTML = '';
            imageContainer.innerHTML = '';
            
            if (!data || Object.keys(data).length === 0) {
                textContainer.innerHTML = '<p style="color:#666; text-align:center; margin:5px;">لا توجد ختمات نصية.</p>';
                imageContainer.innerHTML = '<p style="color:#666; text-align:center; margin:5px;">لا توجد ختمات مصورة.</p>';
                return;
            }
            
            const sortedKeys = Object.keys(data).sort((a, b) => extractNumber(data[a].title) - extractNumber(data[b].title));
            let textHtml = '';
            let imageHtml = '';
            
            sortedKeys.forEach(key => {
                const hasImage = data[key].image && data[key].image.trim() !== "";
                const rowContent = `
                    <div class="admin-khatma-row">
                        <span>${data[key].title || 'بدون عنوان'}</span>
                        <div>
                            <button onclick="edit('${key}')" style="cursor:pointer; padding:2px 6px; margin-left:5px;">✏️</button>
                            <button onclick="del('${key}')" style="color:red; cursor:pointer; padding:2px 6px;">🗑️</button>
                        </div>
                    </div>`;

                if (hasImage) {
                    imageHtml += rowContent;
                } else {
                    textHtml += rowContent;
                }
            });

            textContainer.innerHTML = textHtml || '<p style="color:#666; text-align:center; margin:5px;">لا توجد ختمات نصية.</p>';
            imageContainer.innerHTML = imageHtml || '<p style="color:#666; text-align:center; margin:5px;">لا توجد ختمات مصورة.</p>';
        };

        window.show = (key) => {
            if (allKhatmas[key]) {
                document.getElementById('displayTitle').innerText = allKhatmas[key].title || '';
                const displayContent = document.getElementById('displayContent');
                
                let htmlOutput = '';
                if (allKhatmas[key].image && allKhatmas[key].image.trim() !== "") {
                    htmlOutput += `<div style="text-align: center; margin-bottom: 15px;"><img src="${allKhatmas[key].image}" alt="${allKhatmas[key].title}" style="max-width: 100%; height: auto; border-radius: 8px;"></div>`;
                }
                if (allKhatmas[key].content && allKhatmas[key].content.trim() !== "") {
                    htmlOutput += `<div>${allKhatmas[key].content.replace(/\n/g, '<br>')}</div>`;
                }

                displayContent.innerHTML = htmlOutput || 'لا يوجد محتوى لهذه الختمة.';
                document.getElementById('modalOverlay').style.display = 'flex';
            }
        };

        window.toggleFav = (key) => {
            const idx = favorites.indexOf(key);
            idx > -1 ? favorites.splice(idx, 1) : favorites.push(key);
            localStorage.setItem('user_favorites', JSON.stringify(favorites));
            filterKhatmas();
        };

        window.del = async (key) => { 
            if(confirm("هل أنت متأكد من الحذف؟")) {
                await db.ref('khatmas/' + key).remove(); 
            }
        };
        
        window.edit = (key) => {
            document.getElementById('editKeyId').value = key;
            document.getElementById('singleTitle').value = allKhatmas[key].title || '';
            document.getElementById('singleContent').value = allKhatmas[key].content || '';
            document.getElementById('singleImageFile').value = ''; 
            
            const imgPreview = document.getElementById('currentImagePreview');
            if (allKhatmas[key].image && allKhatmas[key].image.trim() !== "") {
                imgPreview.src = allKhatmas[key].image;
                imgPreview.style.display = 'block';
            } else {
                imgPreview.style.display = 'none';
            }
        };

        function compressImage(file, maxWidth, quality, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', quality);
                    callback(dataUrl);
                };
            };
        }

        document.getElementById('saveSingleBtn').onclick = async () => {
            const key = document.getElementById('editKeyId').value;
            const title = document.getElementById('singleTitle').value.trim();
            const content = document.getElementById('singleContent').value.trim();
            const imageInput = document.getElementById('singleImageFile');

            if (!title) {
                alert("الرجاء إدخال عنوان الختمة!");
                return;
            }

            let existingImage = (key && allKhatmas[key] && allKhatmas[key].image) ? allKhatmas[key].image : "";

            const saveData = (finalImage) => {
                const data = { title: title, content: content, image: finalImage };

                if(key) {
                    db.ref('khatmas/' + key).set(data).then(() => {
                        alert("تم التعديل بنجاح!");
                        resetAdminForm();
                    });
                } else {
                    db.ref('khatmas').push(data).then(() => {
                        alert("تمت الإضافة بنجاح!");
                        resetAdminForm();
                    });
                }
            };

            if (imageInput.files && imageInput.files[0]) {
                compressImage(imageInput.files[0], 400, 0.5, function(compressedBase64) {
                    saveData(compressedBase64);
                });
            } else {
                saveData(existingImage);
            }
        };

        document.getElementById('saveMultiImagesBtn').onclick = async () => {
            const fileInput = document.getElementById('multiImagesInput');
            const progressEl = document.getElementById('ocrProgress');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                alert("الرجاء اختيار صور أولاً!");
                return;
            }

            const files = Array.from(fileInput.files);
            let completed = 0;

            progressEl.innerText = `جاري استخراج العناوين وتحليل 0 من ${files.length} صورة...`;

            let worker;
            try {
                worker = await Tesseract.createWorker('ara+eng');
            } catch (e) {
                worker = await Tesseract.createWorker();
                await worker.loadLanguage('ara+eng');
                await worker.initialize('ara+eng');
            }

            for (let file of files) {
                try {
                    const ret = await worker.recognize(file);
                    let rawText = ret.data.text.trim();
                    
                    let lines = rawText.split('\n')
                        .map(l => l.replace(/[^\u0600-\u06FF\s]/g, '').trim())
                        .filter(l => l.length > 3);

                    let extractedTitle = lines[0] || lines[1] || "";
                    
                    if (!extractedTitle || extractedTitle.length < 3) {
                        extractedTitle = "مفتاح مبارك";
                    } else if (extractedTitle.length > 35) {
                        extractedTitle = extractedTitle.substring(0, 35) + "...";
                    }

                    let finalTitle = extractedTitle;

                    await new Promise((resolve) => {
                        compressImage(file, 400, 0.5, async function(compressedBase64) {
                            await db.ref('khatmas').push({
                                title: finalTitle,
                                content: "",
                                image: compressedBase64
                            });
                            resolve();
                        });
                    });

                    completed++;
                    progressEl.innerText = `تمت معالجة ${completed} من ${files.length} صورة...`;

                } catch (err) {
                    console.error("خطأ في معالجة إحدى الصور:", err);
                    let fallbackTitle = "مفتاح مبارك";
                    
                    await new Promise((resolve) => {
                        compressImage(file, 400, 0.5, async function(compressedBase64) {
                            await db.ref('khatmas').push({
                                title: fallbackTitle,
                                content: "",
                                image: compressedBase64
                            });
                            resolve();
                        });
                    });

                    completed++;
                    progressEl.innerText = `تمت معالجة ${completed} من ${files.length} صورة...`;
                }
            }

            try {
                await worker.terminate();
            } catch(e) {}

            alert("تم الانتهاء من قراءة واستخراج عناوين الختمات المصورة وترتيبها بنجاح!");
            progressEl.innerText = "";
            fileInput.value = "";
        };

        function resetAdminForm() {
            document.getElementById('singleTitle').value = '';
            document.getElementById('singleContent').value = '';
            document.getElementById('singleImageFile').value = '';
            document.getElementById('editKeyId').value = '';
            document.getElementById('currentImagePreview').style.display = 'none';
        }

        document.getElementById('saveBtn').onclick = async () => {
            const text = document.getElementById('bulkArea').value;
            const segments = text.split('~~~');
            for(let seg of segments) {
                if(seg.trim().length > 5) {
                    const lines = seg.trim().split('\n');
                    await db.ref('khatmas').push({ title: lines[0], content: lines.slice(1).join('\n'), image: "" });
                }
            }
            alert("تمت الإضافة الجماعية!");
            document.getElementById('bulkArea').value = '';
        };

        window.switchTab = (tab) => {
            document.getElementById('allTab').classList.toggle('active', tab === 'all');
            document.getElementById('imagesTab').classList.toggle('active', tab === 'images');
            document.getElementById('favTab').classList.toggle('active', tab === 'fav');
            filterKhatmas();
        };
        
        window.filterKhatmas = () => {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            const filtered = {};
            const searchWords = query ? query.split(/\s+/) : [];

            Object.keys(allKhatmas).forEach(k => {
                const title = (allKhatmas[k].title || "").toLowerCase();
                if (searchWords.length === 0) {
                    filtered[k] = allKhatmas[k];
                } else {
                    if (searchWords.some(word => title.includes(word))) {
                        filtered[k] = allKhatmas[k];
                    }
                }
            });
            
            const activeTab = document.querySelector('.tab-btn.active').id;
            let currentView = 'all';
            if (activeTab === 'imagesTab') currentView = 'images';
            if (activeTab === 'favTab') currentView = 'fav';
            
            renderList(filtered, currentView);
        };
    </script>
</body>
</html>
