<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحديث التطبيق</title><style>body{font-family:Arial,sans-serif;text-align:center;padding:60px 20px;color:#173b36;background:#f4faf7}button{padding:14px 28px;border:0;border-radius:12px;background:#176b5d;color:#fff;font-size:18px}#status{margin:25px;font-size:17px}</style></head>
<body><h2>تحديث التطبيق</h2><div id="status">جارٍ تنظيف النسخة القديمة...</div><script>
(async()=>{
 const status=document.getElementById('status');
 try{
  if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
  if('caches' in window){const names=await caches.keys();await Promise.all(names.map(n=>caches.delete(n)));}
  status.textContent='اكتمل التنظيف. جارٍ فتح النسخة الجديدة...';
 }catch(e){status.textContent='تمت المتابعة إلى النسخة الجديدة...';}
 setTimeout(()=>location.replace('./?v=60&fresh='+Date.now()),700);
})();
</script></body></html>
